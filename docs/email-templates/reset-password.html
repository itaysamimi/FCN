<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>איפוס סיסמה ל-FCN</title>
  </head>
  <body style="margin:0; padding:0; background-color:#09080d;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#09080d;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
            <tr>
              <td align="center" style="padding-bottom:24px; font-family:Arial, Helvetica, sans-serif; font-size:36px; font-weight:bold; letter-spacing:1px; color:#8b5cf6;" dir="ltr">
                FCN
              </td>
            </tr>
            <tr>
              <td dir="rtl" align="right" style="background-color:#13111a; border:1px solid #2a2538; border-radius:16px; padding:32px 24px; font-family:Arial, Helvetica, sans-serif; color:#ece9f5; text-align:right;">
                <h1 style="margin:0 0 12px 0; font-size:22px; font-weight:bold; color:#ece9f5;">
                  איפוס סיסמה
                </h1>
                <p style="margin:0 0 24px 0; font-size:16px; line-height:1.6; color:#9a93ad;">
                  קיבלנו בקשה לאיפוס הסיסמה שלך ב-FCN. כדי לבחור סיסמה חדשה, לחצו על הכפתור.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
                  <tr>
                    <td align="center" bgcolor="#8b5cf6" style="border-radius:12px;">
                      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/set-password"
                         style="display:inline-block; padding:14px 32px; font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:bold; color:#ffffff; text-decoration:none; border-radius:12px;">
                        בחירת סיסמה חדשה
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0 0; font-size:13px; line-height:1.6; color:#9a93ad;">
                  הקישור חד-פעמי ותקף לזמן מוגבל. אם לא ביקשת לאפס את הסיסמה, אפשר להתעלם מהמייל והסיסמה הנוכחית תישאר כמו שהיא.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:20px; font-family:Arial, Helvetica, sans-serif; font-size:12px; color:#6b6480;">
                FCN · הענן המשפחתי שלנו
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
